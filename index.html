<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watermelon Maker</title>
<meta name="theme-color" content="#ff9a4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Watermelon">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="hud">
    <button id="snd" class="round green">🔊</button>
    <div id="sc"><b id="score">0</b><small>👑 <span id="best">0</span></small></div>
    <div id="nx"><img id="next" alt=""><small>ถัดไป</small></div>
  </div>
  <canvas id="c" width="360" height="600"></canvas>
  <div id="chain"></div>
  <button id="restart" class="big red">เริ่มใหม่</button>
  <div id="over" hidden><h2>เกมจบแล้ว!</h2><p>คะแนน <b id="final">0</b></p><button id="again" class="big green">เล่นอีกครั้ง</button></div>
</div>
<script src="config.js"></script>
<script src="sprites.js"></script>
<script src="sound.js"></script>
<script src="physics.js"></script>
<script src="game.js"></script>
<script src="pwa.js"></script>
</body>
</html>
